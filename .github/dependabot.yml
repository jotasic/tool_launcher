# 의존성 보안/버전 업데이트 PR 자동 생성
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # 마이너/패치는 한 PR로 묶어 소음 최소화
      minor-and-patch:
        update-types: ['minor', 'patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
